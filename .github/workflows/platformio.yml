name: PlatformIO CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Create config.h
        working-directory: ./firmware
        run: cp config/config.h.template config/config.h

      - name: Build PlatformIO Project
        run: pio run

      - name: Upload artifact on ubuntu-latest
        if: ${{ matrix.os == 'ubuntu-latest' }}
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32doit-devkit-v1/firmware.bin

      - name: Find artifact upload comment
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
        uses: peter-evans/find-comment@v3
        id: find-upload-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: compiled firmware

      - name: Post link to artifact
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-upload-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            Thanks for your contribution!

            You can download the latest compiled firmware [here :rocket:](${{ steps.artifact-upload-step.outputs.artifact-url }}).
